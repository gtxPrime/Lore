import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    // alias(libs.plugins.google.services) // Removed old google-services.json
}

android {
    namespace 'com.gxdevs.lore'
    compileSdk 37

    defaultConfig {
        applicationId "com.gxdevs.lore"
        minSdk 26
        targetSdk 37
        versionCode 8
        versionName '1.0.7'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keyPropertiesFile = rootProject.file('key.properties')
            if (!keyPropertiesFile.exists()) {
                keyPropertiesFile = file('key.properties')
            }
            if (keyPropertiesFile.exists()) {
                def keyProperties = new Properties()
                keyProperties.load(new FileInputStream(keyPropertiesFile))
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            } else if (project.hasProperty('KEYSTORE_FILE')) {
                storeFile file(project.property('KEYSTORE_FILE'))
                storePassword project.property('KEYSTORE_PASSWORD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
    buildToolsVersion '36.1.0'
    compileSdkMinor 0

    // Modern packaging block (replaces deprecated packagingOptions)
    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt'
            ]
        }
    }

    // Do NOT compress .tflite model files — they must be mmap'd for fast loading
    androidResources {
        noCompress += ["tflite"]
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

