import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    // alias(libs.plugins.google.services) // Removed old google-services.json
}

android {
    namespace 'com.gxdevs.lore'
    compileSdk 37

    defaultConfig {
        applicationId "com.gxdevs.lore"
        minSdk 26
        targetSdk 37
        versionCode 7
        versionName '1.0.6'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keyPropertiesFile = rootProject.file('key.properties')
            if (!keyPropertiesFile.exists()) {
                keyPropertiesFile = file('key.properties')
            }
            if (keyPropertiesFile.exists()) {
                def keyProperties = new Properties()
                keyProperties.load(new FileInputStream(keyPropertiesFile))
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            } else if (project.hasProperty('KEYSTORE_FILE')) {
                storeFile file(project.property('KEYSTORE_FILE'))
                storePassword project.property('KEYSTORE_PASSWORD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
    buildToolsVersion '36.1.0'
    compileSdkMinor 0

    // Modern packaging block (replaces deprecated packagingOptions)
    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt'
            ]
        }
    }

    // Do NOT compress .tflite model files — they must be mmap'd for fast loading
    androidResources {
        noCompress += ["tflite"]
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.material.icons.extended
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.ui.text
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    // Room with KTX coroutine support
    implementation libs.androidx.room.runtime
    ksp libs.androidx.room.compiler
    implementation libs.apiRoom.ktx

    // ── On-Device AI Stack (100% Free, 100% Private, ~0 KB overhead) ──────────
    // Architecture: User mood selection IS the training signal.
    // The adaptive model learns each user's personal writing style over time.
    // No 20MB model needed — personalization beats generic models for journals.
    //
    // Layer 1: MoodScoringEngine   — pure Kotlin lexicon, 25+ languages, bigrams/negation
    // Layer 2: SentimentScorer     — pure Kotlin VADER algorithm, compound scoring
    // Layer 3: ML Kit Language ID  — 110 languages, instant, fully offline
    // Layer 4: AdaptiveMoodModel   — Room Naive Bayes, learns from every user confirmation
    //
    // Privacy: All processing on-device. No text ever leaves the device.

    // ML Kit Language ID — BUNDLED (17.0.6). ~900KB. Works fully offline.
    // Identifies 110 languages to apply the correct lexicon weight boosts.
    implementation libs.mlkit.language.id

    // MediaPipe + LiteRT removed — no bundled model needed.
    // The adaptive Room-based Naive Bayes is more accurate for personal journals
    // than a generic MobileBERT because it learns THIS user's specific vocabulary.
    // Can be added back later if a bundled model is ever introduced.
    // implementation 'com.google.mediapipe:tasks-text:0.10.35'
    // implementation 'com.google.android.gms:play-services-tflite-java:16.5.0'
    // implementation 'com.google.android.gms:play-services-tflite-support:16.5.0'

    // ── Security & Auth ───────────────────────────────────────────────────────
    implementation libs.androidx.security.crypto
    implementation libs.androidx.biometric

    // ── Media & Data ──────────────────────────────────────────────────────────
    implementation libs.glide.compose
    implementation libs.google.gson
    implementation libs.androidx.datastore.preferences
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // Media3 ExoPlayer
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui

    // WorkManager (background model download on first launch)
    implementation libs.androidx.work.runtime.ktx

    // ── Firebase ──────────────────────────────────────────────────────────────
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.remote.config

    // ── Google Play ───────────────────────────────────────────────────────────
    implementation libs.play.app.update
    implementation libs.play.app.update.ktx
    implementation libs.play.services.auth
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services.auth
    implementation libs.googleid
    implementation libs.play.billing
    implementation libs.play.billing.ktx
    // ── Compose LiveData (WorkManager progress observation) ───────────────────
    implementation "androidx.compose.runtime:runtime-livedata"
}
